name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build Linux
        run: GOOS=linux GOARCH=amd64 go build -o /tmp/myde-linux ./cmd/myde

      - name: Build macOS
        run: GOOS=darwin GOARCH=arm64 go build -o /tmp/myde-darwin ./cmd/myde

      - name: Build Windows
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/myde.exe ./cmd/myde
